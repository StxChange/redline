name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v4

      - name: 'Deploy to Azure Static Web Apps'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }} # created when provisioning the Static Web App
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for GitHub integrations (comments, PR status)
          action: "upload"
          app_location: "/" # app is at repository root
          api_location: ""   # no Azure Functions API
          output_location: "" # no build output folder; upload files from root

# Notes:
# 1) Create an Azure Static Web App in the Azure Portal or with the Azure CLI. During creation you'll
#    get a deployment token. Add that token to this repository's Settings → Secrets as
#    AZURE_STATIC_WEB_APPS_API_TOKEN.
# 2) If your site needs a build step (npm, hugo, etc.), change `action` to "upload_and_build" and
#    set `app_location` and `output_location` appropriately (for example `app_location: "/"` and
#    `output_location: "./public"`).