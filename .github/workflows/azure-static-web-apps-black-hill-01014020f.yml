name: Azure Static Web Apps CI/CD

on: []
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Prepare deploy artifact (exclude build directory)
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
        run: |
          echo "Preparing artifact folder (excluding 'build')"
          rm -rf ./artifact || true
          mkdir -p ./artifact
          rsync -a --exclude='build' --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='requirements.txt' --exclude='*.py' --exclude='*.pyc' --exclude='__pycache__' --exclude='dist' --exclude='*.spec' --exclude='venv' --exclude='.env' --exclude='*.xlsx' ./ ./artifact/
        shell: bash
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          # Use  add the repository-level AZURE deployment token (ensure this secret is set in repo Settings → Secrets → Actions)
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          # Deploy the cleaned artifact folder (repo root minus 'build')
          app_location: "" # deploy cleaned artifact
          api_location: "" # Api source code path - optional
          output_location: "" # upload-only from repo root
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"

